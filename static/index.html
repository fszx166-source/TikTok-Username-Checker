
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خميعات لليوزرات</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;background:#09090d;color:#fff;font-family:Arial,sans-serif}
.container{max-width:800px;margin:25px auto;background:#14141c;border:1px solid #292936;border-radius:20px;padding:22px}
header{text-align:center}
h1{font-size:28px}
p{color:#aaa;line-height:1.8}
.badge{display:inline-block;background:#252532;padding:8px 13px;border-radius:20px;font-size:12px}
label{display:block;margin:22px 0 10px}
select,button{width:100%;padding:13px;border-radius:11px;border:1px solid #333;background:#20202b;color:white;font-size:16px}
.buttons{display:flex;gap:10px;margin-top:12px}
button{cursor:pointer;font-weight:bold}
.start{background:white;color:#111}
.stop{background:#302029;color:#ff8c9b}
.stats{display:flex;justify-content:space-between;gap:10px;margin:22px 0;color:#bbb}
#results{display:grid;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr;background:#20202a;padding:12px;border-radius:12px}
.username{font-size:17px;font-weight:bold;overflow-wrap:anywhere}
.status{font-size:12px;margin-top:6px;direction:rtl}
.good{color:#55e69a}
.bad{color:#ff7185}
.unknown{color:#ffce75}
.copy{width:auto;padding:9px 12px;font-size:13px}
footer{font-size:12px;line-height:1.8;color:#999;text-align:center;margin-top:25px}
@media(max-width:450px){.container{padding:16px}h1{font-size:24px}.buttons{gap:7px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>خميعات لليوزرات</h1>
<p>ولّد اقتراحات يوزرات تيك توك وافحصها ✨</p>
<span class="badge">USERNAME GENERATOR + CHECKER</span>
</header>

<label for="length">طول اليوزر</label>
<select id="length">
<option value="3">3 خانات</option>
<option value="4" selected>4 خانات</option>
<option value="5">5 خانات</option>
</select>

<div class="buttons">
<button class="start" id="start">بدء التوليد والفحص</button>
<button class="stop" id="stop">إيقاف</button>
</div>

<div class="stats">
<span>الاقتراحات: <b id="count">0</b></span>
<span id="state">متوقف</span>
</div>

<div id="results"></div>

<footer>
✔️ الحساب ظهر في بيانات تيك توك.
<br>
❌ لم يتأكد وجود الحساب، وهذا لا يعني أنه متاح.
<br>
قد يحدّ تيك توك من الطلبات؛ الفحص ليس ضمانًا للتوفر.
</footer>
</div>

<script>
const chars="abcdefghijklmnopqrstuvwxyz0123456789._";
const results=document.getElementById("results");
const count=document.getElementById("count");
const state=document.getElementById("state");
const startBtn=document.getElementById("start");

let running=false;
let timer=null;
let total=0;
const used=new Set();

function makeUsername(n){
 let s="";
 for(let i=0;i<n;i++){
  s+=chars[Math.floor(Math.random()*chars.length)];
 }
 return s;
}

async function checkUsername(name,status){
 status.className="status unknown";
 status.textContent="⏳ جارٍ الفحص...";
 try{
  const response=await fetch("/api/check?username="+encodeURIComponent(name));
  const data=await response.json();

  if(data.status==="taken"){
   status.className="status good";
   status.textContent="✔️ الحساب موجود";
  }else if(data.status==="invalid"){
   status.className="status bad";
   status.textContent="❌ صيغة غير صحيحة";
  }else{
   status.className="status unknown";
   status.textContent="⚠️ تعذّر التأكد";
  }
 }catch(e){
  status.className="status unknown";
  status.textContent="⚠️ تعذّر الاتصال بالفحص";
 }
}

function generate(){
 if(!running)return;

 let name="",attempts=0;
 do{
  name=makeUsername(Number(document.getElementById("length").value));
  attempts++;
 }while(used.has(name)&&attempts<100);

 if(used.has(name)){
  stopGenerating();
  state.textContent="جرّب طولًا آخر";
  return;
 }

 used.add(name);
 total++;

 const item=document.createElement("div");
 item.className="item";

 const info=document.createElement("div");
 const username=document.createElement("div");
 username.className="username";
 username.textContent="@"+name;

 const status=document.createElement("div");
 status.className="status unknown";
 status.textContent="بانتظار الفحص";

 info.append(username,status);

 const copy=document.createElement("button");
 copy.className="copy";
 copy.textContent="نسخ";
 copy.onclick=async()=>{
  try{
   await navigator.clipboard.writeText(name);
  }catch(e){
   const area=document.createElement("textarea");
   area.value=name;
   document.body.appendChild(area);
   area.select();
   document.execCommand("copy");
   area.remove();
  }
  copy.textContent="تم النسخ ✓";
  setTimeout(()=>copy.textContent="نسخ",1200);
 };

 item.append(info,copy);
 results.prepend(item);
 count.textContent=total;

 while(results.children.length>100){
  results.lastElementChild.remove();
 }

 checkUsername(name,status);
}

function stopGenerating(){
 running=false;
 if(timer){clearInterval(timer);timer=null;}
 state.textContent="متوقف";
 startBtn.disabled=false;
}

startBtn.onclick=()=>{
 if(running)return;
 running=true;
 state.textContent="يولّد ويفحص...";
 startBtn.disabled=true;
 generate();
 timer=setInterval(generate,3000);
};

document.getElementById("stop").onclick=stopGenerating;
</script>
</body>
</html>
